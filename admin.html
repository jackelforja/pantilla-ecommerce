<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Plantilla</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <nav class="bg-gray-900 py-4 px-6 flex flex-wrap justify-between items-center shadow-lg text-white sticky top-0 z-40 gap-4">
    <div class="font-bold text-xl">Panel de Control</div>
    <div class="flex gap-2 flex-wrap">
      <button onclick="abrirConfig()" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-sm font-bold transition"><i class="fa-solid fa-gear"></i> Config.</button>
      <button onclick="descargarBackup()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded text-sm font-bold transition"><i class="fa-solid fa-download"></i> Backup</button>
      <button onclick="abrirCategorias()" class="bg-purple-600 hover:bg-purple-500 px-3 py-2 rounded text-sm font-bold transition"><i class="fa-solid fa-tags"></i> Categorías</button>
      <button onclick="abrirFormProducto()" class="bg-green-600 hover:bg-green-500 px-3 py-2 rounded text-sm font-bold transition"><i class="fa-solid fa-plus"></i> Producto</button>
    </div>
  </nav>

  <main class="py-10 px-6 max-w-7xl mx-auto">
    <div id="grilla-admin" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <p class="col-span-full text-center text-gray-500 py-10">Cargando base de datos...</p>
    </div>
  </main>

  <!-- MODAL PRODUCTO -->
  <div id="modal-producto" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 z-50 overflow-y-auto py-10">
    <div class="bg-white p-6 rounded-lg w-full max-w-md relative my-auto">
      <button onclick="cerrarModales()" class="absolute top-4 right-4 text-gray-500"><i class="fa-solid fa-x"></i></button>
      <h3 id="titulo-modal-prod" class="font-bold text-xl mb-4">Gestionar Producto</h3>
      <form id="form-producto" class="flex flex-col gap-3">
        <input type="hidden" id="p-id">
        <input type="text" id="p-nombre" placeholder="Nombre del producto" required class="border p-2 rounded">
        <input type="number" id="p-precio" placeholder="Precio ($)" required class="border p-2 rounded">
        <select id="p-cat" required class="border p-2 rounded"></select>
        <textarea id="p-desc" placeholder="Descripción corta" required class="border p-2 rounded" rows="3"></textarea>
        <div>
          <label class="text-xs font-bold text-gray-500 mb-1 block">Foto (Automáticamente comprimida)</label>
          <input type="file" id="p-foto" accept="image/*" class="text-sm border p-2 w-full rounded">
          <p id="msg-foto-edit" class="text-xs text-blue-600 mt-1 hidden">Dejá vacío si no querés cambiar la foto actual.</p>
        </div>
        <button type="submit" id="btn-guardar-prod" class="bg-gray-900 text-white font-bold py-3 rounded mt-2">Guardar Producto</button>
      </form>
    </div>
  </div>

  <!-- MODAL CATEGORÍAS -->
  <div id="modal-categorias" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-lg w-full max-w-md relative">
      <button onclick="cerrarModales()" class="absolute top-4 right-4 text-gray-500"><i class="fa-solid fa-x"></i></button>
      <h3 class="font-bold text-xl mb-4">Categorías</h3>
      <form id="form-cat" class="flex gap-2 mb-4">
        <input type="text" id="nueva-cat" placeholder="Nueva categoría..." required class="border p-2 rounded flex-1">
        <button type="submit" class="bg-purple-600 text-white px-4 rounded font-bold"><i class="fa-solid fa-plus"></i></button>
      </form>
      <ul id="lista-cats" class="flex flex-col gap-2 max-h-60 overflow-y-auto"></ul>
    </div>
  </div>

  <!-- MODAL CONFIGURACIÓN GENERAL -->
  <div id="modal-config" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-lg w-full max-w-md relative">
      <button onclick="cerrarModales()" class="absolute top-4 right-4 text-gray-500"><i class="fa-solid fa-x"></i></button>
      <h3 class="font-bold text-xl mb-4"><i class="fa-solid fa-gear"></i> Ajustes de Tienda</h3>
      <form id="form-config" class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase block mb-1">WhatsApp (Para ventas)</label>
          <input type="text" id="cfg-wpp" placeholder="Ej: 54911223344" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase block mb-1">Link de Instagram</label>
          <input type="url" id="cfg-ig" placeholder="https://instagram.com/tu_marca" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase block mb-1">Alias Mercado Pago</label>
          <input type="text" id="cfg-mp" placeholder="mi.alias.mp" required class="w-full border p-2 rounded">
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded">Guardar Ajustes</button>
      </form>
    </div>
  </div>

  <script type="module">
    const IMGBB_API_KEY = "ce0938ece2bee753e1fdb8725e95e854";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoCjENuictaLnsXZtb1FM-73mk7FZhEEM",
      authDomain: "e-commerse-8618e.firebaseapp.com",
      projectId: "e-commerse-8618e",
      storageBucket: "e-commerse-8618e.firebasestorage.app",
      messagingSenderId: "481178573408",
      appId: "1:481178573408:web:db6b2b9a9aa0c35eff8105",
      measurementId: "G-YTZGC49LXJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let categorias = [];
    let configGral = { whatsapp: "", instagram: "", mp_alias: "" };
    let urlImagenActual = "";

    async function inicializar() {
      // 1. Configuración
      const configSnap = await getDoc(doc(db, "configuracion", "general"));
      if(configSnap.exists()) { configGral = configSnap.data(); }
      
      // 2. Categorías
      await refrescarCategorias();
      
      // 3. Productos
      await cargarProductos();
    }

    // --- PRODUCTOS ---
    async function cargarProductos() {
      const snap = await getDocs(collection(db, "productos"));
      productos = [];
      snap.forEach(d => productos.push({ id: d.id, ...d.data() }));
      renderizarAdmin();
    }

    function renderizarAdmin() {
      const grilla = document.getElementById("grilla-admin");
      grilla.innerHTML = "";
      if(productos.length === 0) { grilla.innerHTML = `<p class="col-span-full text-center py-10">Agregá tu primer producto.</p>`; return; }
      
      productos.forEach(p => {
        grilla.innerHTML += `
          <div class="bg-white border p-4 rounded-lg shadow-sm flex flex-col">
            <img src="${p.imagen}" class="w-full h-32 object-contain bg-gray-50 rounded mb-2">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">${p.categoria}</p>
            <h4 class="font-bold leading-tight mb-1">${p.nombre}</h4>
            <p class="text-green-600 font-bold mb-3 mt-auto">$${p.precio}</p>
            <div class="flex gap-2">
              <button onclick="editarProducto('${p.id}')" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs py-2 rounded font-bold"><i class="fa-solid fa-pen"></i> Editar</button>
              <button onclick="borrarProducto('${p.id}')" class="flex-1 bg-red-100 hover:bg-red-200 text-red-600 text-xs py-2 rounded font-bold"><i class="fa-solid fa-trash"></i> Borrar</button>
            </div>
          </div>
        `;
      });
    }

    window.abrirFormProducto = function() {
      document.getElementById('form-producto').reset();
      document.getElementById('p-id').value = "";
      document.getElementById('p-foto').required = true;
      document.getElementById('msg-foto-edit').classList.add('hidden');
      document.getElementById('titulo-modal-prod').innerText = "Nuevo Producto";
      
      const select = document.getElementById('p-cat');
      select.innerHTML = "";
      categorias.forEach(c => select.innerHTML += `<option value="${c.nombre}">${c.nombre}</option>`);
      
      document.getElementById('modal-producto').classList.remove('hidden');
      document.getElementById('modal-producto').classList.add('flex');
    }

    window.editarProducto = function(id) {
      const prod = productos.find(p => p.id === id);
      document.getElementById('p-id').value = prod.id;
      document.getElementById('p-nombre').value = prod.nombre;
      document.getElementById('p-precio').value = prod.precio;
      document.getElementById('p-desc').value = prod.descripcion;
      urlImagenActual = prod.imagen;

      const select = document.getElementById('p-cat');
      select.innerHTML = "";
      categorias.forEach(c => select.innerHTML += `<option value="${c.nombre}" ${c.nombre === prod.categoria ? 'selected' : ''}>${c.nombre}</option>`);
      
      document.getElementById('p-foto').required = false;
      document.getElementById('msg-foto-edit').classList.remove('hidden');
      document.getElementById('titulo-modal-prod').innerText = "Editar Producto";
      
      document.getElementById('modal-producto').classList.remove('hidden');
      document.getElementById('modal-producto').classList.add('flex');
    }

    window.borrarProducto = async function(id) {
      if(confirm("¿Borrar este producto?")) {
        await deleteDoc(doc(db, "productos", id));
        cargarProductos();
      }
    }

    const comprimirImagen = (archivo) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(archivo);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600; 
            const scale = MAX_WIDTH / img.width;
            canvas.width = scale < 1 ? MAX_WIDTH : img.width; 
            canvas.height = scale < 1 ? img.height * scale : img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((b) => resolve(new File([b], archivo.name, { type: 'image/jpeg' })), 'image/jpeg', 0.60); 
          };
        };
      });
    };

    document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = document.getElementById('btn-guardar-prod');
      boton.disabled = true;
      boton.innerText = "Procesando...";

      try {
        const id = document.getElementById('p-id').value;
        const archivo = document.getElementById('p-foto').files[0];
        let urlFinal = urlImagenActual;

        if(archivo) {
          boton.innerText = "Subiendo foto...";
          const comp = await comprimirImagen(archivo);
          const formData = new FormData();
          formData.append("image", comp);
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
          const json = await res.json();
          if(json.success) urlFinal = json.data.url; else throw new Error("Error en ImgBB");
        }

        const data = {
          nombre: document.getElementById('p-nombre').value,
          precio: document.getElementById('p-precio').value,
          categoria: document.getElementById('p-cat').value,
          descripcion: document.getElementById('p-desc').value,
          imagen: urlFinal
        };

        if(id) await updateDoc(doc(db, "productos", id), data);
        else await addDoc(collection(db, "productos"), data);
        
        cerrarModales();
        cargarProductos();
      } catch (err) { alert(err.message); }
      finally { boton.disabled = false; boton.innerText = "Guardar Producto"; }
    });

    // --- CATEGORÍAS ---
    async function refrescarCategorias() {
      const snap = await getDocs(collection(db, "categorias"));
      categorias = [];
      snap.forEach(d => categorias.push({ id: d.id, ...d.data() }));
      
      const ul = document.getElementById('lista-cats');
      ul.innerHTML = "";
      categorias.forEach(c => {
        const ojo = c.oculta ? 'fa-eye-slash text-gray-400' : 'fa-eye text-blue-600';
        ul.innerHTML += `
          <li class="flex justify-between items-center bg-gray-50 p-2 border rounded">
            <span class="text-sm ${c.oculta ? 'line-through text-gray-400' : 'font-bold'}">${c.nombre}</span>
            <div class="flex gap-3">
              <button onclick="toggleCat('${c.id}', ${c.oculta})"><i class="fa-solid ${ojo}"></i></button>
              <button onclick="borrarCat('${c.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
            </div>
          </li>
        `;
      });
    }

    window.abrirCategorias = function() {
      document.getElementById('modal-categorias').classList.remove('hidden');
      document.getElementById('modal-categorias').classList.add('flex');
    }

    document.getElementById('form-cat').addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = document.getElementById('nueva-cat').value;
      await addDoc(collection(db, "categorias"), { nombre: n, oculta: false });
      document.getElementById('nueva-cat').value = "";
      refrescarCategorias();
    });

    window.toggleCat = async function(id, estado) { await updateDoc(doc(db, "categorias", id), { oculta: !estado }); refrescarCategorias(); }
    window.borrarCat = async function(id) { if(confirm("¿Borrar?")) { await deleteDoc(doc(db, "categorias", id)); refrescarCategorias(); } }

    // --- CONFIGURACIÓN & BACKUP ---
    window.abrirConfig = function() {
      document.getElementById('cfg-wpp').value = configGral.whatsapp || "";
      document.getElementById('cfg-ig').value = configGral.instagram || "";
      document.getElementById('cfg-mp').value = configGral.mp_alias || "";
      document.getElementById('modal-config').classList.remove('hidden');
      document.getElementById('modal-config').classList.add('flex');
    }

    document.getElementById('form-config').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        whatsapp: document.getElementById('cfg-wpp').value,
        instagram: document.getElementById('cfg-ig').value,
        mp_alias: document.getElementById('cfg-mp').value
      };
      await setDoc(doc(db, "configuracion", "general"), data);
      configGral = data;
      alert("Ajustes guardados");
      cerrarModales();
    });

    window.descargarBackup = function() {
      const datos = JSON.stringify({productos, configGral, categorias}, null, 2);
      const blob = new Blob([datos], { type: 'application/json' });
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = u; a.download = `backup_plantilla_${new Date().getTime()}.json`; a.click();
    }

    window.cerrarModales = function() {
      document.querySelectorAll('.fixed').forEach(m => { m.classList.add('hidden'); m.classList.remove('flex'); });
    }

    inicializar();
  </script>
</body>
</html>
